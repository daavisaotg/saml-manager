<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ERB · SAML — South America MPS League</title>
<link rel="icon" type="image/png" href="img/erb-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#fbb80b; --primary-dim:#8a6706;
  --bg:#01081e; --bg2:#050e2c; --bg3:#0a1638;
  --line:#182449; --white:#ffffff; --muted:#8b95bd; --muted2:#5c6690;
  --green:#33d17a; --red:#ff5470;
  --r:10px;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box; margin:0; padding:0;}
html{scroll-padding-top:env(safe-area-inset-top,0px); background:var(--bg); min-height:100%;}
body{
  font-family:'Montserrat',system-ui,sans-serif; background:var(--bg); color:var(--white);
  min-height:100vh; display:flex; overflow-x:hidden;
}
.mono{font-family:'Montserrat',sans-serif;}
::-webkit-scrollbar{width:8px;height:8px;} ::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}

#sidebar{
  width:240px; min-width:240px; background:var(--bg2); border-right:1px solid var(--line);
  height:100vh; position:sticky; top:0; display:flex; flex-direction:column; padding:24px 16px;
}
.brand{display:flex; align-items:center; gap:10px; padding:0 8px 28px 8px;}
.brand .mark{width:34px;height:34px;border-radius:8px;overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.brand .txt div:first-child{font-weight:700;font-size:14px;letter-spacing:.2px;}
.brand .txt div:last-child{font-size:11px;color:var(--muted);}
nav{display:flex;flex-direction:column;gap:2px;}
.navbtn{
  display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:8px; cursor:pointer;
  color:var(--muted); font-size:13.5px; font-weight:500; border:none; background:transparent; text-align:left; width:100%;
  transition:background .12s, color .12s;
}
.navbtn:hover{background:var(--bg3); color:var(--white);}
.navbtn.active{background:rgba(251,184,11,.12); color:var(--primary); font-weight:600;}
.navbtn svg{width:17px;height:17px;flex-shrink:0;}
.sidefoot{margin-top:auto; padding:12px 8px; font-size:11px; color:var(--muted2); border-top:1px solid var(--line); padding-top:16px;}

#main{flex:1; min-width:0; height:100vh; overflow-y:auto;}
#topbar{
  position:sticky; top:0; z-index:5; background:rgba(1,8,30,.85); backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line); padding:18px 32px; display:flex; align-items:center; justify-content:space-between; gap:20px;
}
#topbar h1{font-size:19px; font-weight:700;}
#topbar .sub{font-size:12.5px; color:var(--muted); margin-top:2px;}
.searchbox{position:relative; width:280px;}
.searchbox input{
  width:100%; background:var(--bg3); border:1px solid var(--line); color:var(--white); border-radius:8px;
  padding:9px 12px 9px 34px; font-size:13px; font-family:inherit;
}
.searchbox input:focus{outline:none; border-color:var(--primary);}
.searchbox svg{position:absolute; left:11px; top:50%; transform:translateY(-50%); width:15px; height:15px; color:var(--muted2);}
#searchresults{position:absolute; top:calc(100% + 6px); left:0; right:0; background:var(--bg3); border:1px solid var(--line); border-radius:10px; overflow:hidden; display:none; max-height:300px; overflow-y:auto; z-index:20;}
#searchresults div{padding:9px 12px; font-size:12.5px; cursor:pointer; border-bottom:1px solid var(--line);}
#searchresults div:hover{background:var(--bg2);}
#searchresults .tag{color:var(--muted2); font-size:10.5px; text-transform:uppercase; letter-spacing:.4px;}

.view{padding:28px 32px 60px 32px; display:none;}
.view.active{display:block;}

.grid{display:grid; gap:16px;}
.grid-stats{grid-template-columns:repeat(auto-fit,minmax(190px,1fr));}
.card{background:var(--bg2); border:1px solid var(--line); border-radius:var(--r); padding:18px;}
.stat .label{font-size:12px; color:var(--muted); font-weight:500;}
.stat .value{font-size:26px; font-weight:800; margin-top:8px; font-family:'Montserrat',sans-serif;}
.stat .value.accent{color:var(--primary);}
.section-title{font-size:14px; font-weight:700; margin:32px 0 14px 0; display:flex; align-items:center; justify-content:space-between;}
.section-title span.hint{font-size:11.5px; color:var(--muted2); font-weight:500;}

table{width:100%; border-collapse:collapse; font-size:13px;}
th{
  text-align:left; padding:11px 14px; color:var(--muted); font-weight:600; font-size:11.5px;
  border-bottom:1px solid var(--line); cursor:pointer; user-select:none; white-space:nowrap;
}
th:hover{color:var(--white);}
th .arrow{font-size:9px; margin-left:3px; color:var(--primary);}
td{padding:11px 14px; border-bottom:1px solid var(--line); white-space:nowrap;}
tbody tr{cursor:pointer; transition:background .1s;}
tbody tr:hover{background:var(--bg3);}
.tablewrap{background:var(--bg2); border:1px solid var(--line); border-radius:var(--r); overflow:auto;}
.pill{display:inline-flex; align-items:center; padding:3px 9px; border-radius:100px; font-size:11px; font-weight:600;}
.pill.active{background:rgba(51,209,122,.15); color:var(--green);}
.pill.inactive{background:rgba(140,150,180,.15); color:var(--muted);}
.avatar{width:28px;height:28px;border-radius:7px;background:var(--bg3); display:inline-flex; align-items:center;justify-content:center; font-size:11px; font-weight:700; color:var(--primary); border:1px solid var(--line); overflow:hidden; flex-shrink:0;}
.avatar img{width:100%;height:100%;object-fit:cover;}

.btn{
  background:var(--primary); color:var(--bg); border:none; padding:10px 16px; border-radius:8px; font-weight:700;
  font-size:13px; cursor:pointer; font-family:inherit; display:inline-flex; align-items:center; gap:6px;
}
.btn:hover{filter:brightness(1.08);}
.btn.ghost{background:transparent; color:var(--white); border:1px solid var(--line);}
.btn.ghost:hover{background:var(--bg3);}
.btn.sm{padding:7px 11px; font-size:12px;}
.btn.danger{background:transparent;border:1px solid var(--red);color:var(--red);}

.overlay{position:fixed; inset:0; background:rgba(1,8,30,.75); backdrop-filter:blur(3px); z-index:50; display:none; align-items:flex-start; justify-content:center; overflow-y:auto; padding:40px 20px;}
.overlay.active{display:flex;}
.modal{background:var(--bg2); border:1px solid var(--line); border-radius:14px; width:100%; max-width:560px; padding:26px; animation:pop .15s ease;}
.modal.wide{max-width:760px;}
@keyframes pop{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:translateY(0)}}
.modal h2{font-size:17px; font-weight:700; margin-bottom:4px;}
.modalhead{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:18px;}
.xbtn{background:var(--bg3); border:1px solid var(--line); color:var(--muted); width:30px; height:30px; border-radius:8px; cursor:pointer; font-size:15px;}
.formgrid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.field{display:flex; flex-direction:column; gap:6px; margin-bottom:12px;}
.field.full{grid-column:1/-1;}
.field label{font-size:12px; color:var(--muted); font-weight:600;}
input,select,textarea{
  background:var(--bg3); border:1px solid var(--line); color:var(--white); border-radius:8px; padding:9px 11px;
  font-size:13px; font-family:inherit; width:100%;
}
input:focus,select:focus,textarea:focus{outline:none; border-color:var(--primary);}
.checkrow{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--muted);}
.modalfoot{display:flex; justify-content:flex-end; gap:10px; margin-top:18px; border-top:1px solid var(--line); padding-top:16px;}

.ranklist{display:flex; flex-direction:column; gap:2px;}
.rankrow{display:flex; align-items:center; gap:12px; padding:10px 6px; border-bottom:1px solid var(--line);}
.rankrow:last-child{border:none;}
.rankpos{width:22px; text-align:center; font-weight:800; font-size:12px; color:var(--muted2); font-family:'Montserrat',sans-serif;}
.rankbarwrap{flex:1; height:6px; background:var(--bg3); border-radius:3px; overflow:hidden;}
.rankbar{height:100%; background:var(--primary); border-radius:3px;}
.rankval{font-size:12.5px; font-weight:700; font-family:'Montserrat',sans-serif; color:var(--primary); width:auto; text-align:right; flex-shrink:0;}

.profilehead{display:flex; align-items:center; gap:16px; margin-bottom:0;}
.profilehead .av{width:64px;height:64px;border-radius:14px;background:var(--bg3);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;color:var(--primary); overflow:hidden; flex-shrink:0;}
.profilehead .av img{width:100%;height:100%;object-fit:cover;}
.tier-badge{background:var(--bg3); border:1px solid var(--line); padding:3px 10px; border-radius:100px; font-size:11px; color:var(--muted); font-weight:600;}
.finrow{display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--line); font-size:13px;}
.finrow:last-child{border:none;}
.finrow .l{color:var(--muted);}
.finrow .r{font-family:'Montserrat',sans-serif; font-weight:700;}
.emptystate{text-align:center; padding:60px 20px; color:var(--muted);}
.emptystate .big{font-size:15px; color:var(--white); font-weight:600; margin-bottom:6px;}
.cfgrow{display:flex; align-items:center; justify-content:space-between; padding:16px 0; border-bottom:1px solid var(--line);}
.cfgrow:last-child{border:none;}
.cfgrow .cl{font-size:13px; font-weight:600;}
.cfgrow .cs{font-size:11.5px; color:var(--muted); margin-top:2px;}
.cfgrow input{width:100px; text-align:right; font-family:'Montserrat',sans-serif; font-weight:700;}
.toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--white); color:var(--bg); padding:11px 20px; border-radius:8px; font-size:13px; font-weight:600; z-index:100; display:none; box-shadow:0 8px 24px rgba(0,0,0,.4);}

.avatarpick{display:flex; align-items:center; gap:14px;}
.avatarpick .av{width:60px;height:60px;border-radius:12px;background:var(--bg3);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;color:var(--primary); overflow:hidden; flex-shrink:0;}
.avatarpick .av img{width:100%;height:100%;object-fit:cover;}
.avatarpick input[type=file]{display:none;}
.avatarpick label.pickbtn{background:var(--bg3); border:1px solid var(--line); padding:8px 14px; border-radius:8px; font-size:12.5px; font-weight:600; cursor:pointer;}
.avatarpick label.pickbtn:hover{background:var(--line);}

.pill.gold{background:rgba(251,184,11,.15);color:var(--primary);}
.pill.bad{background:rgba(255,84,112,.15);color:var(--red);}
.perfcard{display:flex;flex-direction:column;gap:12px;}
.perfhead{display:flex;align-items:center;gap:12px;}
.scorebox{text-align:right;line-height:1;}
.scorenum{font-size:30px;font-weight:800;color:var(--primary);}
.scoremax{font-size:11px;color:var(--muted2);margin-top:2px;}
.stars{color:var(--primary);letter-spacing:2px;font-size:14px;}
.stag{display:inline-flex;gap:4px;align-items:center;background:var(--bg3);border:1px solid var(--line);border-radius:100px;padding:3px 9px;font-size:11px;color:var(--muted);}
.mini{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;text-align:center;}
.mini .v{font-family:'Montserrat',sans-serif;font-weight:700;font-size:15px;}
.mini .l{font-size:10px;color:var(--muted);margin-top:2px;}
.is-hof{background:#341539 !important;border-color:#7a3a87 !important;}
tr.is-hof td{background:#341539 !important;}
.hofname{color:#e3b7ee;}
.hof-badge{display:inline-flex;align-items:center;background:#341539;border:1px solid #a45bb3;color:#f1d3f8;font-size:10px;font-weight:800;letter-spacing:.06em;padding:2px 8px;border-radius:100px;white-space:nowrap;}
.profilehead.is-hof{border-radius:12px;padding:12px;}
.tagpick{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;}
.tagchip input{position:absolute;opacity:0;pointer-events:none;}
.tagchip span{display:inline-block;border:1px solid var(--line);background:var(--bg3);border-radius:100px;padding:5px 12px;font-size:11.5px;font-weight:800;letter-spacing:.03em;color:var(--muted);cursor:pointer;user-select:none;}
.tagchip input:checked+span{background:var(--primary);color:#01081e;border-color:var(--primary);}
.tagchip input:focus-visible+span{outline:2px solid var(--white);outline-offset:2px;}
.crest{object-fit:contain;flex-shrink:0;vertical-align:middle;}
.crest-fb{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:var(--bg3);border:1px solid var(--line);color:var(--muted);font-weight:800;letter-spacing:-.02em;flex-shrink:0;overflow:hidden;}
.fx-line{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:15px;}
.fx-team{display:inline-flex;align-items:center;gap:6px;}
.fx-x{color:var(--muted2);font-weight:700;font-size:12px;}
.fx-meta{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:4px;}
.fx-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.fx-prev{max-height:240px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:6px 10px;background:var(--bg3);font-size:12.5px;margin-top:10px;}
.fx-prev .row{display:flex;align-items:center;gap:8px;padding:4px 0;border-top:1px solid var(--line);flex-wrap:wrap;}
.fx-prev .row:first-child{border-top:none;}
.crestrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:13px;}
.ec-ucl{background:linear-gradient(155deg,#2d1b6b 0%,#1b1046 100%);border-color:#7b5cf0;--bg3:#35257f;--line:#4b3b9c;--muted:#bdb1ee;--muted2:#9488d2;}
.ec-lib{background:linear-gradient(155deg,#4a3606 0%,#2a1f04 100%);border-color:#fbb80b;--bg3:#5a430a;--line:#8a6706;--muted:#e6d39b;--muted2:#bda35c;}
.ec-cwc{background:#fff;border-color:#fff;color:#01081e;--white:#01081e;--bg3:#eef1f9;--line:#d5dbe9;--muted:#4b5578;--muted2:#6d7799;--primary:#8a6706;--red:#c4203f;--green:#12803f;}
.pill.ucl{background:rgba(139,108,240,.28);color:#dcd2ff;}
.pill.lib{background:rgba(251,184,11,.22);color:#ffd25a;}
.pill.cwc{background:#fff;color:#01081e;}
.ec-cwc .pill.cwc{background:#01081e;color:#fff;}
.ec-cwc .pill.gold{background:rgba(138,103,6,.14);}
.ec-done{background:linear-gradient(155deg,#0d4429 0%,#06240f 100%);border-color:#33d17a;--bg3:#11522f;--line:#1d7044;--muted:#a6e4c3;--muted2:#73bd98;}
.ec-done .fx-line{opacity:.92;}
.pill.done{background:#33d17a;color:#01081e;font-weight:800;letter-spacing:.04em;}
.ec-done .pill.gold,.ec-done .pill.ucl,.ec-done .pill.lib,.ec-done .pill.cwc{background:rgba(255,255,255,.12);color:#d8f5e6;}
.ec-done .crewrow{opacity:.85;}
.apt{background:var(--bg3);border:1px solid var(--line);border-left:3px solid var(--primary);border-radius:10px;padding:10px 12px;}
.apt .al{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;font-weight:700;}
.apt .at{display:flex;gap:6px;flex-wrap:wrap;}
.dt{font-size:12px;color:var(--muted);} .dt summary{cursor:pointer;color:var(--white);font-weight:600;}
.dt ul{margin:8px 0 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;}
.dt li{background:var(--bg3);border:1px solid var(--line);border-radius:8px;padding:7px 10px;}
.dt a{color:var(--primary);}
.fgroup{margin:18px 0 8px 0;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;}
.rvrow{display:grid;grid-template-columns:1fr 1fr 1fr 34px;gap:8px;margin-bottom:8px;align-items:end;}
.gmrow{display:grid;grid-template-columns:2fr 1fr 90px 34px;gap:8px;margin-bottom:8px;align-items:end;}
.rvrow label,.gmrow label{font-size:10.5px;color:var(--muted);display:block;margin-bottom:3px;}
@media(max-width:700px){.rvrow,.gmrow{grid-template-columns:1fr 1fr;}}
.frow{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted);}
.frow .fl{width:132px;flex-shrink:0;}
.frow .fv{width:26px;text-align:right;font-family:'Montserrat',sans-serif;color:var(--white);}
.warn{color:#fbb80b;font-size:16px;font-weight:900;line-height:1;cursor:help;flex:none;}.crewrow .wk{flex:none;font-size:10px;}.crewrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;padding:8px 0;border-top:1px solid var(--line);font-size:13px;}
@media(max-width:900px){
  body{flex-direction:column;}
  #sidebar{position:fixed; bottom:0; left:0; right:0; width:100%; height:auto; flex-direction:row; padding:8px 10px env(safe-area-inset-bottom,10px) 10px; z-index:30; border-top:1px solid var(--line); border-right:none; overflow-x:auto;}
  .brand,.sidefoot{display:none;}
  nav{flex-direction:row; width:100%; justify-content:space-between;}
  .navbtn{flex-direction:column; font-size:10px; gap:4px; padding:6px 4px; flex-shrink:0; min-width:62px; align-items:center;}
  #main{height:auto;}
  .view{padding:20px 16px 90px 16px;}
  #topbar{padding:14px 16px; flex-wrap:wrap;}
  .searchbox{width:100%; order:3;}
  .formgrid{grid-template-columns:1fr;}
}

/* ===== Identidade nova: tipografia pesada + dashboard institucional ===== */
:root{--graphite:#0c0f17; --graphite2:#151a25; --gline:#222838;}
body{font-weight:500;}
.mono,.stat .value,.rankval,.rankpos{font-variant-numeric:tabular-nums;}
#topbar h1,.modal h2{font-weight:900;letter-spacing:-.01em;}
.btn{font-weight:800;letter-spacing:.02em;}
th{font-weight:800;text-transform:uppercase;letter-spacing:.05em;font-size:10.5px;}
.section-title{font-weight:900;text-transform:uppercase;letter-spacing:.02em;}
.pill,.tier-badge{font-weight:800;}
.navbtn{font-weight:700;} .navbtn.active{font-weight:800;}
.stat .value{font-weight:900;}
.stat .label,.field label{font-weight:700;}

#view-dashboard{padding:0 0 60px 0;}
.d-wrap{max-width:1280px;margin:0 auto;padding:0 32px;}
.d-strip{background:#fff;color:var(--bg);border-bottom:1px solid #e3e6ee;}
.d-strip .in{max-width:1280px;margin:0 auto;padding:14px 32px;display:flex;align-items:center;justify-content:space-between;gap:16px;}
.d-strip img{height:46px;width:auto;display:block;}
.d-strip .meta{display:flex;align-items:center;gap:16px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:#2a3558;text-align:right;}
.d-live{display:inline-flex;align-items:center;gap:7px;}
.d-live i{width:8px;height:8px;border-radius:50%;background:#1fb25a;box-shadow:0 0 0 3px rgba(31,178,90,.2);}

.d-hero{position:relative;overflow:hidden;min-height:420px;display:flex;align-items:center;border-bottom:5px solid var(--primary);
  background:linear-gradient(115deg,#01081e 0%,#021039 55%,#06194f 100%);}
.saml-seal{display:inline-flex;align-items:center;gap:11px;background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:999px;padding:6px 16px 6px 6px;margin-bottom:16px;backdrop-filter:blur(4px);}
.saml-seal img{width:34px;height:34px;border-radius:50%;flex:none;display:block;background:#fff;}
.saml-seal b{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;font-weight:800;color:var(--white);line-height:1.25;}
@media(max-width:640px){.saml-seal b{font-size:10.5px}.saml-seal img{width:28px;height:28px}}
.d-hero-photo{position:absolute;right:0;top:0;bottom:0;width:62%;}
.d-hero-photo img{width:100%;height:100%;object-fit:cover;object-position:60% 20%;display:block;
  -webkit-mask-image:linear-gradient(to right,transparent 0,#000 40%);mask-image:linear-gradient(to right,transparent 0,#000 40%);}
.d-hero-photo:after{content:'';position:absolute;inset:0;background:linear-gradient(to top,rgba(1,8,30,.6),transparent 50%);}
.d-bar1,.d-bar2{position:absolute;top:-10%;bottom:-10%;transform:skewX(-14deg);}
.d-bar1{left:37%;width:44px;background:var(--primary);}
.d-bar2{left:calc(37% + 62px);width:12px;background:#fff;opacity:.9;}
.d-hero-copy{position:relative;z-index:2;width:100%;max-width:1280px;margin:0 auto;padding:56px 32px;}
.d-hero-text{max-width:540px;}
.d-kick{display:flex;align-items:center;gap:12px;margin-bottom:22px;}
.d-kick img{width:46px;height:46px;border-radius:10px;}
.d-kick span{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--primary);}
.d-hero h2{font-size:clamp(36px,5.2vw,68px);font-weight:900;line-height:.95;letter-spacing:-.015em;text-transform:uppercase;color:#fff;}

<script>
/* ERB Manager — camada Supabase (substitui claude.use('db'/'user')) */
(function(){
  const SB_URL='https://ntsihwqfuhqkkyciosol.supabase.co', SB_KEY='COLAR_CHAVE_PUBLICAVEL_AQUI';
  const _AH=(typeof location!=='undefined'&&location.hash)?location.hash.replace(/^#/,''):'';
  const _AQ=(typeof location!=='undefined'&&location.search)?location.search.replace(/^\?/,''):'';
  const sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
  window._sb=sb;
  const NS='saml_'; window.DBNS=NS;
  const EDITOR_MAIL='editor.saml@erbmanager.app'; window.EDITOR_MAIL=EDITOR_MAIL;
  const EXPK='saml_login_exp', LIVEK='saml_login_live';
  const marcarValidade=dias=>{ try{ localStorage.setItem(EXPK, dias? String(Date.now()+dias*86400000) : '0'); sessionStorage.setItem(LIVEK,'1'); }catch(e){} };
  const limparValidade=()=>{ try{ localStorage.removeItem(EXPK); sessionStorage.removeItem(LIVEK); }catch(e){} };
  const rid=()=>{const c='abcdefghijklmnopqrstuvwxyz0123456789';let s='';for(let i=0;i<20;i++)s+=c[Math.floor(Math.random()*c.length)];return s;};
  const snapOf=rows=>({docs:rows.map(r=>({id:r.id,data:()=>r.data})),exists:rows.length>0});
  function watch(coll,filterId,cb,err){
    const cache=new Map(); let alive=true;
    const emit=()=>{ const rows=[...cache.values()]; cb(filterId?{exists:rows.length>0,data:()=>rows[0]&&rows[0].data,id:filterId}:snapOf(rows)); };
    const load=async()=>{
      let q=sb.from('docs').select('id,data').eq('coll',coll); if(filterId) q=q.eq('id',filterId);
      const {data,error}=await q; if(error){ err&&err(error); return; }
      cache.clear(); data.forEach(r=>cache.set(r.id,r)); if(alive) emit();
    };
    load();
    const ch=sb.channel('rt-'+coll+'-'+(filterId||'')+'-'+rid().slice(0,5))
      .on('postgres_changes',{event:'*',schema:'public',table:'docs',filter:'coll=eq.'+coll},async p=>{
        const id=(p.new&&p.new.id)||(p.old&&p.old.id); if(!id||(filterId&&id!==filterId)) return;
        if(p.eventType==='DELETE'){ cache.delete(id); emit(); return; }
        const {data}=await sb.from('docs').select('id,data').eq('coll',coll).eq('id',id).maybeSingle();
        if(data){ cache.set(id,data); emit(); }
      }).subscribe();
    window.addEventListener('erb-auth',load);
    return ()=>{alive=false;sb.removeChannel(ch);};
  }
  const must=async p=>{ const {error}=await p; if(error) throw error; };
  const docRef=(coll,id)=>({
    get:async()=>{ const {data}=await sb.from('docs').select('data').eq('coll',coll).eq('id',id).maybeSingle(); return {exists:!!data,data:()=>data&&data.data,id}; },
    set:d=>must(sb.from('docs').upsert({coll,id,data:d,updated_at:new Date().toISOString()})),
    update:d=>must(sb.rpc('merge_doc',{p_coll:coll,p_id:id,p_data:d})),
    delete:()=>must(sb.from('docs').delete().eq('coll',coll).eq('id',id)),
    onSnapshot:(cb,err)=>watch(coll,id,cb,err)
  });
  const db={
    collection:name=>({ doc:id=>docRef(NS+name,id), add:async d=>{const id=rid(); await must(sb.from('docs').insert({coll:NS+name,id,data:d})); return {id};}, onSnapshot:(cb,err)=>watch(NS+name,null,cb,err) }),
    doc:path=>{ const [c,i]=path.split('/'); return docRef(NS+c,i); }
  };
  let owner=false;
  async function refreshOwner(){
    const {data:{session}}=await sb.auth.getSession();
    if(!session){ owner=false; return; }
    const {data}=await sb.rpc('is_owner'); owner=data===true;
  }
  window.erbAuth={
    email:async()=>{ const {data:{session}}=await sb.auth.getSession(); return session&&session.user.email; },
    login:async email=>{ const {error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+location.pathname}}); if(error) throw error; },
    loginPassword:async(email,password)=>{ const {error}=await sb.auth.signInWithPassword({email,password}); if(error) throw error; limparValidade(); },
    loginEditor:async(password,lembrar)=>{ const {error}=await sb.auth.signInWithPassword({email:EDITOR_MAIL,password}); if(error) throw error; marcarValidade(lembrar?30:0); },
    validade:()=>{ try{ const v=localStorage.getItem(EXPK); if(v===null) return null; const e=Number(v); return e? new Date(e) : 'sessao'; }catch(e){ return null; } },
    setPassword:async password=>{ const {error}=await sb.auth.updateUser({password}); if(error) throw error; },
    logout:async()=>{ limparValidade(); await sb.auth.signOut(); location.reload(); }
  };
  sb.auth.onAuthStateChange((evt)=>{ refreshOwner().then(()=>{
    window.dispatchEvent(new Event('erb-auth'));
    if(evt==='SIGNED_IN'||evt==='INITIAL_SESSION'||evt==='SIGNED_OUT'){
      try{ if(/[#&](access_token|refresh_token|error|error_description|type)=/.test(location.hash)) history.replaceState(null,'',location.pathname+location.search+'#dashboard'); }catch(e){}
      if(typeof window.initUser==='function') window.initUser();
    }
  }); });
  (()=>{ try{
    const v=localStorage.getItem(EXPK); if(v===null) return;
    const e=Number(v);
    const expirou = e===0 ? !sessionStorage.getItem(LIVEK) : Date.now()>e;
    if(expirou){ limparValidade(); sb.auth.signOut().catch(()=>{}); }
  }catch(err){} })();
  const _kick=()=>{ if(typeof window.initUser==='function') window.initUser(); else setTimeout(_kick,150); };
  (async()=>{
    const hp=new URLSearchParams(_AH), qp=new URLSearchParams(_AQ);
    const at=hp.get('access_token'), rt=hp.get('refresh_token'), code=qp.get('code');
    const er=hp.get('error_description')||hp.get('error')||qp.get('error_description')||qp.get('error');
    try{
      if(at&&rt){ const {error}=await sb.auth.setSession({access_token:at,refresh_token:rt}); if(error) throw error; _kick(); }
      else if(code){ const {error}=await sb.auth.exchangeCodeForSession(code); if(error) throw error; _kick(); }
      else if(er){ setTimeout(()=>alert('O link de acesso nao funcionou: '+decodeURIComponent(er).replace(/\+/g,' ')+'\n\nPeca um link novo, ou entre com a senha.'),900); }
      else { _kick(); }
    }catch(e){ setTimeout(()=>alert('Nao foi possivel entrar pelo link: '+(e.message||e)+'\n\nTente entrar com a senha.'),900); }
    try{ if(code) history.replaceState(null,'',location.pathname+location.hash); }catch(e){}
  })();
  window.claude={ use:async name=> name==='db'?db : name==='user'?{isOwner:async()=>{await refreshOwner();return owner;}} : null };
})();

</script>

let DB = { referees:[], config:{main:25, assist:15, wo:5, ad:5}, sumulas:[], escalas:[], historico:[], crests:{} };
let dbc = null, isOwner = false, dbReady = false, userKnown = false, histSub = false;
function subscribeHistory(){
  if(histSub||!dbc) return; histSub=true;
  dbc.collection('historico').onSnapshot(snap=>{
    DB.historico=snap.docs.map(d=>({id:d.id, ...d.data()}));
    if(CURRENT==='historico') render();
  }, ()=>{ histSub=false; });
}
async function initDB(){
  try{ dbc = await claude.use('db'); }catch(e){ dbc = null; }
  if(!dbc){ toast('Banco indisponível — tente recarregar a página'); return; }
  dbc.collection('referees').onSnapshot(snap=>{
    DB.referees = snap.docs.map(d=>({id:d.id, ...d.data()}));
    dbReady = true; render();
  }, ()=> toast('Erro ao sincronizar árbitros'));
  dbc.doc('config/main').onSnapshot(snap=>{
    if(snap.exists) DB.config = snap.data();
    else dbc.doc('config/main').set({main:25, assist:15, wo:5, ad:5}).catch(()=>{});
    render();
  }, ()=> toast('Erro ao sincronizar configurações'));
  dbc.collection('sumulas').onSnapshot(snap=>{
    DB.sumulas = snap.docs.map(d=>({id:d.id, ...d.data()}));
    render();
  }, ()=> toast('Erro ao sincronizar súmulas'));
  dbc.collection('escalas').onSnapshot(snap=>{
    DB.escalas = snap.docs.map(d=>({id:d.id, ...d.data()}));
    render();
  }, ()=> toast('Erro ao sincronizar escalas'));
  dbc.collection('crests').onSnapshot(snap=>{
    const m={}; snap.docs.forEach(d=>{ m[d.id]=d.data(); }); DB.crests=m;
    render();
  }, ()=> toast('Erro ao sincronizar escudos'));
  if(userKnown && isOwner) subscribeHistory();
}
function authMsg(e){ const m=(e&&(e.message||e))+'';
  if(/rate limit/i.test(m)) return 'O limite de e-mails foi atingido (2 por hora). Entre com a senha, ou espere cerca de uma hora.';
  if(/Invalid login credentials/i.test(m)) return 'E-mail ou senha incorretos. Se ainda não criou uma senha, entre pelo link do e-mail e defina uma em Configurações.';
  return m; }
function openLogin(){
  document.getElementById('modalbody').outerHTML = `<div class="modal" id="modalbody">
    <h3 style="margin:0 0 4px">Entrar</h3>
    <div class="cs" style="margin-bottom:16px">Digite a senha de acesso ao painel da SAML.</div>
    <label class="cl">Senha</label>
    <input id="lg_pass" type="password" placeholder="senha de acesso" style="width:100%;margin:6px 0 12px"
      onkeydown="if(event.key==='Enter')doLoginEditor()">
    <label class="checkrow" style="gap:9px;margin-bottom:16px;cursor:pointer">
      <input type="checkbox" id="lg_keep" style="width:auto" checked>
      <span style="font-size:13px">Continuar conectado por 30 dias</span>
    </label>
    <button class="btn" style="width:100%" onclick="doLoginEditor()">Entrar</button>

const TIERS=['','Tier 1','Tier 2','Tier 3','Trial Ref'];
const WO_MIN=20; // duração fixa de uma partida que terminou em W.O. ou Autodraw
function refStats(r){
  const main=Number(r.main||0), assist=Number(r.assist||0), wo=Number(r.wo||0), ad=Number(r.ad||0);
  const yellow=Number(r.yellow||0), red=Number(r.red||0);
  const mainHours=Number(r.mainHours||0), assistHours=Number(r.assistHours||0);
  // MAIN já inclui os W.O. (ex.: 14 MAIN = 13 jogadas + 1 W.O.). A partida que terminou em W.O. paga o valor de W.O., não o de MAIN.
  const mainPlayed=Math.max(0,main-wo-ad);
  const matchCount=main+assist;
  const played=mainPlayed+assist;
  const totalHours = mainHours+assistHours;
  // tempo médio de partida considera SOMENTE o tempo como MAIN. Cada W.O. conta SEMPRE como 20 minutos (WO_MIN).
  const mainMinTotal = mainHours*60 + (wo+ad)*WO_MIN;
  const avgMainMin = main? mainMinTotal/main : 0;
  const pay = mainPlayed*DB.config.main + assist*DB.config.assist + wo*DB.config.wo + ad*(DB.config.ad==null?5:DB.config.ad);
  return {matchCount, played, main, mainPlayed, mainMinTotal, assist, wo, ad, yellow, red, mainHours, assistHours, totalHours, avgMainMin, pay,
    avgYellow: played? yellow/played:0, avgRed: played? red/played:0};
}
function allStats(){ const map={}; DB.referees.forEach(r=>map[r.id]=refStats(r)); return map; }
function fmtMin(min){ const h=Math.floor(min/60), m=Math.round(min%60); return h>0? `${h}h${m>0?m+'m':''}` : `${m}m`; }
function fmtHours(h){ return fmtMin(Number(h||0)*60); }

let pendingAvatar=null;
function handleAvatarFile(input){
  const file=input.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=e=>{
    const img=new Image();
    img.onload=()=>{
      const size=160;
      const canvas=document.createElement('canvas'); canvas.width=size; canvas.height=size;
      const ctx=canvas.getContext('2d');
      const scale=Math.max(size/img.width, size/img.height);
      const w=img.width*scale, h=img.height*scale;
      ctx.drawImage(img, (size-w)/2, (size-h)/2, w, h);
      // detecta se a imagem tem partes transparentes
      let hasAlpha=false;
      try{ const px=ctx.getImageData(0,0,size,size).data; for(let i=3;i<px.length;i+=4){ if(px[i]<250){ hasAlpha=true; break; } } }catch(err){}
      // WebP mantém a transparência; se o navegador não gerar WebP, cai para PNG (com fundo transparente) ou JPEG
      let out=canvas.toDataURL('image/webp',0.85);
      if(out.indexOf('data:image/webp')!==0) out = hasAlpha? canvas.toDataURL('image/png') : canvas.toDataURL('image/jpeg',0.8);
      pendingAvatar = out;
      const prev=document.getElementById('avatarPreview');
      if(prev) prev.innerHTML=`<img src="${pendingAvatar}" alt="">`;
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}

async function saveRef(id){
  if(!isOwner || !dbc){ toast('Somente o dono pode salvar'); return; }
  const name=document.getElementById('f_name').value.trim();
  if(!name){ toast('Informe o nome do árbitro'); return; }
  const data={ name, discordId:document.getElementById('f_discord').value.trim(), tier:document.getElementById('f_tier').value, role:document.getElementById('f_role').value,
    joinDate:document.getElementById('f_join').value, status:document.getElementById('f_status').value,
    main:Number(document.getElementById('f_main').value)||0, assist:Number(document.getElementById('f_assist').value)||0,
    wo:Number(document.getElementById('f_wo').value)||0, ad:Number(document.getElementById('f_ad').value)||0,
    mainHours:(Number(document.getElementById('f_mainhours_h').value)||0) + (Number(document.getElementById('f_mainhours_m').value)||0)/60,
    assistHours:(Number(document.getElementById('f_assisthours_h').value)||0) + (Number(document.getElementById('f_assisthours_m').value)||0)/60,
    yellow:Number(document.getElementById('f_yellow').value)||0, red:Number(document.getElementById('f_red').value)||0,
    certified: document.getElementById('f_certified').checked,
    avatar: pendingAvatar||null };
  const perfNovo=collectPerf(); if(perfNovo) data.perf=perfNovo;
  try{
    const oldRef = id? {...(DB.referees.find(r=>r.id===id)||{})} : null;
    if(id){ await dbc.collection('referees').doc(id).update(data); }
    else { await dbc.collection('referees').add(data); }
    if(id){ const ch=diffRef(oldRef,data); const cp=perfNovo? diffPerf((oldRef||{}).perf||{},perfNovo) : [];
      if(ch.length||cp.length) logChange('edit','Árbitro',data.name,[...ch,...cp]); }
    else logChange('create','Árbitro',data.name,['Cadastro novo'+(data.tier?' · '+data.tier:'')]);
    closeModal(); toast('Árbitro salvo no banco central'); pendingAvatar=null;
  }catch(e){ toast('Não foi possível salvar — tente novamente'); }
}
async function deleteRef(id){
  if(!isOwner || !dbc){ toast('Somente o dono pode excluir'); return; }
  const delName=(DB.referees.find(r=>r.id===id)||{}).name||'(sem nome)';
  try{ await dbc.collection('referees').doc(id).delete(); logChange('delete','Árbitro',delName,[]); closeModal(); toast('Árbitro removido'); }
  catch(e){ toast('Não foi possível excluir — tente novamente'); }
}

    ['Mais partidas','matchCount', v=>v],

/* ---------- Histórico de alterações ---------- */
const TZ='America/Sao_Paulo';
function esc(t){ return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function logChange(kind,entity,title,changes){
  if(!dbc||!isOwner) return;
  dbc.collection('historico').add({ts:Date.now(),kind,entity,title,changes:changes||[]}).catch(()=>{});
}
const REF_LABELS={name:'Nome',discordId:'Discord ID',tier:'Tier',role:'Cargo',joinDate:'Data de entrada',status:'Status',main:'MAIN',assist:'ASSIST',wo:'W.O.',ad:'Autodraw',yellow:'Amarelos',red:'Vermelhos',mainHours:'Horas como MAIN',assistHours:'Horas como Auxiliar',certified:'ERB Certified'};
function diffRef(o,n){
  const out=[]; o=o||{};
  Object.entries(REF_LABELS).forEach(([k,l])=>{
    let a=o[k], b=n[k], fa, fb;
    if(['main','assist','wo','ad','yellow','red'].includes(k)){ a=Number(a||0); b=Number(b||0); fa=a; fb=b; }
    else if(k==='mainHours'||k==='assistHours'){ a=Math.round(Number(a||0)*60); b=Math.round(Number(b||0)*60); fa=fmtMin(a); fb=fmtMin(b); }
    else if(k==='certified'){ a=!!a; b=!!b; fa=a?'sim':'não'; fb=b?'sim':'não'; }
    else { a=a||''; b=b||''; fa=a||'—'; fb=b||'—'; }
    if(a!==b) out.push(l+': '+fa+' → '+fb);
  });
  if((o.avatar||null)!==(n.avatar||null)) out.push('Foto alterada');
  return out;
}
function diffCfg(o,n){
  const out=[]; [['main','Valor MAIN'],['assist','Valor ASSIST'],['wo','Valor W.O.'],['ad','Valor Autodraw']].forEach(([k,l])=>{ if(Number(o[k]||0)!==Number(n[k]||0)) out.push(l+': '+fmt(o[k])+' → '+fmt(n[k])); });
  [['bigMinMain','Mínimo de partidas p/ MAIN em jogo grande',8],['bigMinAssist','Mínimo de partidas p/ ASSIST em jogo grande',5]].forEach(([k,l,d])=>{ const a=o[k]==null?d:Number(o[k]), b=n[k]==null?d:Number(n[k]); if(a!==b) out.push(l+': '+a+' → '+b); });
  return out;
}
function diffMap(a,b,labels){
  const out=[]; Object.entries(labels).forEach(([k,l])=>{ if((a[k]||'')!==(b[k]||'')) out.push(l+': '+(a[k]||'—')+' → '+(b[k]||'—')); });
  return out;
}
const SUM_LABELS={date:'Data',competition:'Competição',round:'Rodada',referee:'Árbitro',home:'Mandante',away:'Visitante',docUrl:'Link da súmula',notes:'Observações'};
function sumView(d){ const r=DB.referees.find(x=>x.id===d.referee); return {date:d.date,competition:d.competition,round:d.round,referee:r?r.name:'',home:d.home,away:d.away,docUrl:d.docUrl,notes:d.notes}; }
const ESC_LABELS={date:'Data',type:'Tipo de jogo',competition:'Competição',round:'Rodada',home:'Mandante',away:'Visitante',main:'MAIN',assists:'Assistentes'};
function escView(d){
  const nm=id=>{ const r=DB.referees.find(x=>x.id===id); return r?r.name:''; };
  return {date:d.date,type:(ESCALA_TYPES[d.type]||ESCALA_TYPES.normal)[0],competition:d.competition,round:d.round,home:d.home,away:d.away,main:nm(d.main),assists:(d.assists||[]).map(nm).filter(Boolean).join(', ')};
}
function diffPerf(o,n){
  o=o||{}; const out=[];
  [['punishments','Punições'],['rematches','Rematches'],['complaints','Reclamações'],['errors','Ocorrências antigas'],['delays','Atrasos'],['lateCancels','Cancelamentos em cima da hora']].forEach(([k,l])=>{ const a=Number(o[k]||0), b=Number(n[k]||0); if(a!==b) out.push(l+': '+a+' → '+b); });
  const cO=x=>(x==null||x==='')?'automático':x+'%';
  if(cO(o.confOverride)!==cO(n.confOverride)) out.push('Índice de Confiança: '+cO(o.confOverride)+' → '+cO(n.confOverride));
  const aO=x=>(x&&x.length)? x.join(', ') : 'automático';
  if(aO(o.aptOverride)!==aO(n.aptOverride)) out.push('Pronto para: '+aO(o.aptOverride)+' → '+aO(n.aptOverride));
  const ov=o.reviews||[], nv=n.reviews||[];
  if(JSON.stringify(ov)!==JSON.stringify(nv)) out.push('Decisões revistas: '+ov.length+' → '+nv.length+(ov.length===nv.length?' (conteúdo editado)':''));
  const og=o.games||[], ng=n.games||[];
  if(JSON.stringify(og.map(g=>[g.label,g.date,g.rating]))!==JSON.stringify(ng.map(g=>[g.label,g.date,g.rating]))){
    const avg=a=>{ const r=a.filter(g=>Number(g.rating)>0); return r.length? (r.reduce((x,g)=>x+Number(g.rating),0)/r.length).toFixed(1) : '—'; };
    out.push('Notas por partida: '+og.length+' → '+ng.length+' partidas · média '+avg(og)+' → '+avg(ng));
  }

const LEVELS=[[95,'Elite','95–100'],[90,'Excelente','90–94'],[80,'Muito Bom','80–89'],[70,'Bom','70–79'],[60,'Regular','60–69'],[0,'Em observação','0–59']];
// Etiquetas de "Pronto para". Perfis: ELITE (prioridade total), UEFA e CONMEBOL.
const TAG_GROUPS=[
  ['Perfil',['ELITE','UEFA','CONMEBOL']],
  ['Europa',['CHAMPIONS','DIVISÃO 1 EUROPA','DIVISÃO 2 EUROPA','CLÁSSICOS EUROPA']],
  ['Américas',['LIBERTADORES','DIVISÃO 1 AMÉRICA','DIVISÃO 2 AMÉRICA','CLÁSSICOS AMÉRICA']]
];
const TAGS=TAG_GROUPS.flatMap(g=>g[1]);
// Quem pode o de cima, automaticamente pode o de baixo
const TAG_IMPLIES={
  'CHAMPIONS':['DIVISÃO 1 EUROPA'], 'DIVISÃO 1 EUROPA':['DIVISÃO 2 EUROPA'],
  'LIBERTADORES':['DIVISÃO 1 AMÉRICA'], 'DIVISÃO 1 AMÉRICA':['DIVISÃO 2 AMÉRICA'],
  'UEFA':['CHAMPIONS','CLÁSSICOS EUROPA'], 'CONMEBOL':['LIBERTADORES','CLÁSSICOS AMÉRICA']
};
function tagClosure(list){
  const out=new Set((list||[]).filter(t=>TAGS.includes(t))); let ch=true;
  while(ch){ ch=false; [...out].forEach(t=>(TAG_IMPLIES[t]||[]).forEach(x=>{ if(!out.has(x)){ out.add(x); ch=true; } })); }
  return TAGS.filter(t=>out.has(t));
}
// Etiquetas automáticas (quando o dono não marcou nenhuma): vêm da nota e da região
function autoTagsFor(score,region){
  if(score==null) return [];

  else if(region==='CONMEBOL') t.push(score>=80?'CONMEBOL':'DIVISÃO 1 AMÉRICA');
  else t.push('DIVISÃO 2 AMÉRICA');

}
const BIGS=[['finals','Finais'],['semis','Semifinais'],['quarters','Quartas'],['champions','Champions'],['libertadores','Libertadores'],['derbies','Derbys/Clássicos'],['cwc','Club World Cup']];
function lerp(v,pts){
  if(v<=pts[0][0]) return pts[0][1];

}

function perfOf(r){

  const reviews=p.reviews||[], rem=Number(p.rematches||0), comp=Number(p.complaints||0), legacy=Number(p.errors||0);
  const errW = reviews.length + rem + comp*0.5 + legacy;
  const games=p.games||[], rated=games.filter(g=>Number(g.rating)>0);
  const avgRating = rated.length? rated.reduce((a,g)=>a+Number(g.rating),0)/rated.length : (Number(p.rating)>0? Number(p.rating) : null);
  const cpm=s.played? (s.yellow+s.red)/s.played : null;
  // Big Matches: cada tipo vale um peso (final conta mais que clássico)
  const bigPts=BIGS.reduce((a,b)=>a+Number((p.big||{})[b[0]]||0)*BIG_W[b[0]],0);
  // Forma recente: E=100, B=65, R=15; as partidas mais recentes pesam mais
  const rc=(p.recent||'').split('');
  let rw=0,rt=0; rc.forEach((c,i)=>{ const v=c==='E'?100:c==='B'?65:15, wt=i+1; rw+=wt; rt+=wt*v; });
  const form = rc.length? rt/rw : null;
  const f=[
    ['Tempo médio',15, s.main? lerp(s.avgMainMin,[[35,100],[38,85],[42,65],[50,30],[60,0]]) : null],
    ['Cartões/partida',10, cpm==null? null : cpm<2? 40+30*cpm : cpm<=5? 100 : Math.max(0,100-(cpm-5)*100/7)],
    ['Precisão disciplinar',15, off? Math.max(0,100-(errW/off)*200) : null],
    ['Disponibilidade',10, n? Math.max(0,100-(s.wo+s.ad)*10-Number(p.lateCancels||0)*8-Number(p.delays||0)*4) : null],
    ['Volume de partidas',20, off? lerp(off,[[0,0],[5,25],[15,60],[30,90],[40,100]]) : null],
    ['Avaliação pós-jogo',10, avgRating!=null? Math.min(100,avgRating*10) : null],
    ['Big Matches',10, off? lerp(bigPts,[[0,0],[5,40],[15,70],[30,90],[50,100]]) : null],
    ['Forma recente',10, form],
  ];
  let w=0,t=0; f.forEach(x=>{ if(x[2]!=null){ w+=x[1]; t+=x[1]*x[2]; } });
  // Nota bruta + peso da amostra: poucas partidas puxam a nota para a média (50). Com K=5: 1 partida = 17% · 5 = 50% · 15 = 75% · 40 = 89%
  const raw = w? t/w : null;
  const sampleW = off/(off+SAMPLE_K);
  // Bônus de experiência: quanto mais partidas oficiais, maior o Overall (até +10)

/* ---------- Possível Escala ---------- */
const ESCALA_TYPES={normal:['Normal',[]],mata:['Mata-mata',['mata']],decisao:['Final / Decisão',['decisoes','mata']],classico:['Clássico',['classicos']],cwc:['Club World Cup',[]],ucl:['Champions League',[]],lib:['Libertadores',[]],uefa:['UEFA',['intl','uefa']],conmebol:['CONMEBOL',['intl','conmebol']]};
function bigMin(){ const c=DB.config||{}; return {main:c.bigMinMain==null?8:Number(c.bigMinMain), assist:c.bigMinAssist==null?5:Number(c.bigMinAssist)}; }
function normName(t){ return String(t||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim(); }
const INT_AM='1496188718610911404', INT_EU='';
// Times que pedem árbitros de alto nível
const BIG_UEFA=[]; // a SAML nao tem times europeus
const BIG_CONMEBOL=['CRV','INT','PAL','SCCP','GRE','RIV','CABJ','UCH']; // SAML Elite
const TEAM_ALIAS={'vasco':'CRV','vasco da gama':'CRV','internacional':'INT','inter':'INT','palmeiras':'PAL','corinthians':'SCCP','gremio':'GRE','river plate':'RIV','river':'RIV','boca juniors':'CABJ','boca':'CABJ','u d del chile':'UCH','universidad de chile':'UCH','u de chile':'UCH','santos':'SFC','athletico paranaense':'CAP','atlhetico paranaense':'CAP','athletico':'CAP','universitario':'UNIVERSITARIO','racing club':'RAC','racing':'RAC','independiente':'IND','colo colo':'COL','atletico nacional':'ATN','nacional':'ATN','deportivo cali':'DCL','cali':'DCL'};
// Clássicos reconhecidos automaticamente (o dono também pode marcar o tipo "Clássico" à mão)
const RIVALS_AM=[['SCCP','PAL'],['SCCP','SFC'],['PAL','SFC'],['CABJ','RIV'],['GRE','INT'],['RAC','IND'],['COL','UCH']];
const RIVALS_EU=[];
const RIVALS=[...RIVALS_AM,...RIVALS_EU];
function divInfo(m){
  const raw=((m.divCode||'')+' '+(m.competition||'')).toUpperCase();
  const reg=/EUROP/.test(raw)?'EU':/AMERIC|SAML|CONMEBOL|SUL|SOUTH/.test(raw)?'AM':null;
  const lvl=/ELITE|D1|ONE|\b1\b|PRIMEIRA/.test(raw)?1:/CHALLENGER|D2|TWO|\b2\b|SEGUNDA/.test(raw)?2:null;
  return {reg,lvl};
}
function teamKey(code,id){
  if(id&&id===INT_AM) return 'INT';
  const n=normName(code); if(!n) return null;
  return TEAM_ALIAS[n]||n.toUpperCase().replace(/ /g,'');
}
const CWC_ID='comp-cwc';
function compKey(m){ return /CLUB\s*WORLD\s*CUP|\bCWC\b|MUNDIAL\s*DE\s*CLUBES/i.test(((m.competition||'')+' '+(m.divCode||''))) ? CWC_ID : null; }
function compCrestId(m){ const k=compKey(m); return (k&&DB.crests[k])? k : (m.divId||''); }
function compType(m){
  if(m.type==='cwc'||compKey(m)===CWC_ID) return 'cwc';
  const raw=(m.competition||'')+' '+(m.divCode||'');
  if(m.type==='lib'||/LIBERTADORES/i.test(raw)) return 'lib';
  if(m.type==='ucl'||/CHAMPIONS|\bUCL\b/i.test(raw)) return 'ucl';
  return null;
}
function autoType(d){ return d.comp||(d.region==='UEFA'?'uefa':d.region==='CONMEBOL'?'conmebol':d.classico?'classico':'normal'); }
function demandOf(m){
  const a=teamKey(m.home,m.homeId), b=teamKey(m.away,m.awayId);
  const comp=compType(m);
  // Na Club World Cup (UEFA x CONMEBOL) vale só o campeonato: nenhum dos dois continentes é marcado
  const uefa=comp!=='cwc'&&(BIG_UEFA.includes(a)||BIG_UEFA.includes(b)||m.type==='uefa'||comp==='ucl');
  const conm=comp!=='cwc'&&(BIG_CONMEBOL.includes(a)||BIG_CONMEBOL.includes(b)||m.type==='conmebol'||comp==='lib');
  const pair=(L)=>!!a&&!!b&&L.some(p=>(p[0]===a&&p[1]===b)||(p[0]===b&&p[1]===a));
  const clEU=pair(RIVALS_EU), clAM=pair(RIVALS_AM);
  const classico=m.type==='classico'||clEU||clAM;
  const clReg=clEU?'EU':clAM?'AM':null;
  const cwc=comp==='cwc';
  const big=uefa||conm||classico||cwc||comp!=null||m.type==='mata'||m.type==='decisao';
  return {big,cwc,comp,uefa,conm,classico,clReg,div:divInfo(m),region:uefa?'UEFA':conm?'CONMEBOL':null,rank:(cwc?5:0)+(comp==='ucl'||comp==='lib'?4:0)+(m.type==='decisao'?4:0)+(uefa||conm?3:0)+(classico?2:0)+(big?1:0)};
}
function busyFor(date,excludeIds){
  const ex=new Set(excludeIds||[]);
  return new Set(DB.escalas.filter(e=>!ex.has(e.id)&&e.date===date).flatMap(e=>[e.main,...(e.assists||[])]).filter(Boolean));
}
// Sugere MAIN + 2 ASSIST. Jogos grandes exigem mínimo de partidas e dão prioridade clara a quem tem a etiqueta da região (UEFA / CONMEBOL).
function crewFor(m,busy,load){
  const d=demandOf(m), mn=bigMin(), ld=load||{};
  const pool=DB.referees.filter(r=>r.status!=='Inativo' && !(busy&&busy.has(r.id))).map(r=>{
    const P=perfOf(r), n=P.off, tags=new Set(P.apt);
    let fit=P.score==null?0:P.score;
    const eu=tags.has('UEFA')||tags.has('CHAMPIONS'), am=tags.has('CONMEBOL')||tags.has('LIBERTADORES');
    // ELITE: prioridade total em jogo grande (e nas finais)
    if(d.big && tags.has('ELITE')) fit+=50;
    if(m.type==='decisao' && tags.has('ELITE')) fit+=30;
    // árbitro UEFA apita UEFA e árbitro CONMEBOL apita CONMEBOL; o outro lado pode, sem prioridade
    if(d.cwc && (eu||am)) fit+=15;
    if(d.uefa && eu) fit+=40;
    if(d.conm && am) fit+=40;
    // clássicos: prioridade para a etiqueta da região do clássico
    if(d.classico){ const ok=d.clReg==='EU'? tags.has('CLÁSSICOS EUROPA') : d.clReg==='AM'? tags.has('CLÁSSICOS AMÉRICA') : (tags.has('CLÁSSICOS EUROPA')||tags.has('CLÁSSICOS AMÉRICA')); if(ok) fit+=30; }
    // divisão: quem tem a etiqueta da divisão do jogo leva vantagem; quem não tem, perde posição (sem ser barrado)
    if(d.div.reg && d.div.lvl){ const tg=(d.div.lvl===1?'DIVISÃO 1 ':'DIVISÃO 2 ')+(d.div.reg==='EU'?'EUROPA':'AMÉRICA'); if(tags.has(tg)) fit+=(d.div.lvl===1?8:0); else if(tags.size) fit-=(d.div.lvl===1?20:10); }
    if(d.big){ if(P.stars>=4) fit+=6; if(P.stars<=2) fit-=15; }
    fit-=(ld[r.id]||0)*4;
    return {id:r.id,fit,n};
  }).sort((a,b)=>b.fit-a.fit);
  const main=pool.find(x=>!d.big||x.n>=mn.main)||null;
  const assists=pool.filter(x=>x!==main&&(!d.big||x.n>=mn.assist)).slice(0,2);
  return {main:main?main.id:null, assists:assists.map(x=>x.id), demand:d};
}
// Distribui escalas para uma lista de partidas: jogos grandes primeiro, depois os demais. Cada árbitro 1x por dia.
function assignCrews(items){
  const ids=new Set(items.map(i=>i.id).filter(Boolean));
  const busyByDay={}, load={};
  DB.escalas.forEach(e=>{ if(ids.has(e.id)||!e.main) return; const b=busyByDay[e.date]||(busyByDay[e.date]=new Set()); [e.main,...(e.assists||[])].forEach(x=>{ if(x){ b.add(x); load[x]=(load[x]||0)+1; } }); });
  const order=[...items].sort((a,b)=>(demandOf(b).rank-demandOf(a).rank)||((a.ts||0)-(b.ts||0)));
  let incomplete=0;
  order.forEach(m=>{
    const busy=busyByDay[m.date]||(busyByDay[m.date]=new Set());
    const c=crewFor(m,busy,load);
    [c.main,...c.assists].forEach(x=>{ if(x){ busy.add(x); load[x]=(load[x]||0)+1; } });
    m.main=c.main; m.assists=c.assists;
    if(!c.main||c.assists.length<2) incomplete++;
  });
  return incomplete;
}

/* ---------- Fixtures (importação do Discord) ---------- */
const CODE_FIX={cap:'CAP',universitario:'UNI',conmenbol:'CONMEBOL'};
function fixCode(c){ const k=String(c||'').toLowerCase(); return CODE_FIX[k] || (/^[a-z]+$/.test(c)? c.toUpperCase() : c); }
function parseTeam(t){
  t=(t||'').trim(); const m=t.match(/<a?:(\w+):(\d+)>/);
  if(m) return {code:fixCode(m[1]), id:m[2]};
  return {code:t.replace(/[*_`~]/g,'').trim(), id:''};
}
function spDate(ts){
  const d=new Date(ts*1000);
  const date=new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit'}).format(d);
  const time=new Intl.DateTimeFormat('pt-BR',{timeZone:TZ,hour:'2-digit',minute:'2-digit',hour12:false}).format(d);
  return {date,time};
}
function parseFixtures(text){
  const out=[], bad=[]; let div={name:'',code:'',id:''};
  String(text||'').split(/\r?\n/).forEach(raw=>{
    const line=raw.replace(/^\s*[>#\s]+/,'').trim(); if(!line) return;
    if(line.indexOf('|')<0){
      const h=line.match(/(?:<a?:(\w+):(\d+)>\s*)?\*\*(.+?)\*\*/);
      if(h && !/LEAGUE\s*GW/i.test(h[3]) && !/^\s*@/.test(h[3])) div={code:h[1]||'',id:h[2]||'',name:h[3].trim()};
      return;
    }
    const tm=line.match(/<t:(\d+)(?::[a-zA-Z])?>/);
    if(!tm){ if(/\sx\s/i.test(line)) bad.push(raw.trim()); return; }
    const body=line.replace(/<t:\d+(?::[a-zA-Z])?>/,'').trim();
    const parts=body.split('|').map(x=>x.trim());
    if(parts.length<3){ bad.push(raw.trim()); return; }
    const round=parts[1].replace(/[*_`]/g,'').trim();
    const teams=parts.slice(2).join('|').split(/\s+[xX×]\s+/);
    if(teams.length!==2){ bad.push(raw.trim()); return; }
    const h=parseTeam(teams[0]), a=parseTeam(teams[1]);
    if(!h.code||!a.code){ bad.push(raw.trim()); return; }
    const dt=spDate(Number(tm[1]));
    // a divisão pode vir também no começo da própria linha
    const lead=parts[0].match(/<a?:(\w+):(\d+)>/);
    out.push({ts:Number(tm[1]), date:dt.date, time:dt.time, round, competition:div.name||'', divCode:div.code||(lead?lead[1]:''), divId:div.id||(lead?lead[2]:''),
      home:h.code, homeId:h.id, away:a.code, awayId:a.id});
  });
  return {matches:out, bad};
}
function fxKey(e){ return [e.ts||e.date, e.homeId||e.home, e.awayId||e.away].join('|'); }
function openFixturesForm(){
  if(!isOwner){ toast('Somente o dono pode importar'); return; }

  const t=document.getElementById('fx_text').value, box=document.getElementById('fx_prev'), go=document.getElementById('fx_go');

/* ---------- Escudos ---------- */
function crestTargets(){
  const m={};
  DB.escalas.forEach(e=>{
    if(e.homeId) m[e.homeId]={id:e.homeId,code:e.home,kind:'Time'};
    if(e.awayId) m[e.awayId]={id:e.awayId,code:e.away,kind:'Time'};
    if(e.divId) m[e.divId]={id:e.divId,code:e.divCode||e.competition,kind:'Divisão'};
  });
  m[CWC_ID]={id:CWC_ID,code:'CWC',kind:'Competição'};
  return Object.values(m).sort((a,b)=>(a.kind+a.code).localeCompare(b.kind+b.code));
}
function fileToCrest(file){
  return new Promise((res,rej)=>{
    const rd=new FileReader();
    rd.onerror=rej;
    rd.onload=e=>{
      const img=new Image();
      img.onerror=rej;
      img.onload=()=>{
        const size=96, c=document.createElement('canvas'); c.width=size; c.height=size;
        const ctx=c.getContext('2d'); const sc=Math.min(size/img.width,size/img.height);
        const w=img.width*sc,h=img.height*sc; ctx.drawImage(img,(size-w)/2,(size-h)/2,w,h);
        let out=c.toDataURL('image/webp',0.9);
        if(out.indexOf('data:image/webp')!==0) out=c.toDataURL('image/png');
        res(out);
      };
      img.src=e.target.result;
    };
    rd.readAsDataURL(file);
  });
}
function crestList(){
  const t=crestTargets();
  return t.length? t.map(x=>`<div class="crestrow">${crestHTML(x.id,x.code,34)}<div style="flex:1;min-width:0"><b>${esc(x.code)}</b> <span style="color:var(--muted);font-size:11.5px">${x.kind}</span></div>

    ${DB.crests[x.id]?`<button class="btn ghost sm" onclick="removeCrest('${x.id}')">Remover</button>`:''}</div>`).join('') : '<div style="color:var(--muted);font-size:13px;padding:10px 0">Importe um fixtures primeiro: os times aparecem aqui.</div>';
}

    <div style="font-size:12.5px;color:var(--muted);margin-bottom:12px">Envie a imagem de cada escudo uma vez. Ela fica salva e aparece em todas as rodadas. Para enviar vários de uma vez, nomeie cada arquivo com a sigla do time (ex.: <b>FLA.png</b>, <b>RMA.png</b>).</div>
    <label class="btn" style="cursor:pointer;display:inline-block">Enviar vários arquivos<input type="file" accept="image/*" multiple style="display:none" onchange="uploadCrestsBulk(this)"></label>
    <div id="crestlist" style="margin-top:14px;max-height:52vh;overflow:auto">${crestList()}</div>

async function uploadCrest(id,code,input){
  const f=input.files[0]; if(!f||!isOwner||!dbc) return;
  try{ const img=await fileToCrest(f); DB.crests[id]={code,img}; await dbc.collection('crests').doc(id).set({code,img}); logChange('edit','Escudo',code,['Escudo atualizado']); refreshCrestList(); toast('Escudo salvo'); }
  catch(e){ toast('Não foi possível salvar o escudo'); }
}
async function uploadCrestsBulk(input){
  if(!isOwner||!dbc) return;
  const files=[...input.files]; if(!files.length) return;
  const targets=crestTargets(); let ok=0, miss=[];
  for(const f of files){
    const code=f.name.replace(/\.[^.]+$/,'').trim().toUpperCase();
    const hit=targets.filter(t=>String(t.code).toUpperCase()===code && !DB.crests[t.id]);
    const hit2=hit.length? hit : targets.filter(t=>String(t.code).toUpperCase()===code);
    if(!hit2.length){ miss.push(f.name); continue; }
    try{ const img=await fileToCrest(f); for(const t of hit2){ DB.crests[t.id]={code:t.code,img}; await dbc.collection('crests').doc(t.id).set({code:t.code,img}); } ok++; }
    catch(e){ miss.push(f.name); }
  }
  if(ok) logChange('edit','Escudo','Envio em lote',[ok+' escudo'+(ok===1?'':'s')+' atualizado'+(ok===1?'':'s')]);
  refreshCrestList(); toast(ok+' escudo'+(ok===1?'':'s')+' salvo'+(ok===1?'':'s')+(miss.length?' · sem time: '+miss.join(', '):''));
}

  if(!isOwner||!dbc) return;
  try{ await dbc.collection('crests').doc(id).delete(); delete DB.crests[id]; refreshCrestList(); toast('Escudo removido'); }
  catch(e){ toast('Não foi possível remover'); }
}

  const s = id? DB.sumulas.find(x=>x.id===id) : {};
  document.getElementById('modalbody').innerHTML = `
    <div class="modalhead"><h2>${id?'Editar Súmula':'Nova Súmula'}</h2><button class="xbtn" onclick="closeModal()">✕</button></div>
    <div class="formgrid">
      <div class="field"><label>Data</label><input type="date" id="s_date" value="${s.date||new Date().toISOString().slice(0,10)}"></div>
      <div class="field"><label>Competição</label><input id="s_comp" value="${s.competition||''}"></div>
      <div class="field"><label>Rodada</label><input id="s_round" value="${s.round||''}"></div>
      <div class="field"><label>Árbitro responsável</label><select id="s_ref">${sumulaRefOptions(s.referee)}</select></div>
      <div class="field"><label>Mandante</label><input id="s_home" value="${s.home||''}"></div>
      <div class="field"><label>Visitante</label><input id="s_away" value="${s.away||''}"></div>
      <div class="field full"><label>Link do documento (Google Docs, etc.) *</label><input id="s_url" placeholder="https://docs.google.com/..." value="${s.docUrl||''}"></div>
      <div class="field full"><label>Observações</label><textarea id="s_notes" rows="2">${s.notes||''}</textarea></div>
    </div>
    <div class="modalfoot">
      ${id?'<button class="btn danger" onclick="deleteSumula(\''+id+'\')">Excluir</button>':''}
      <button class="btn ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn" onclick="saveSumula('${id||''}')">Salvar</button>
    </div>`;
  openModal();
}
async function saveSumula(id){
  if(!isOwner || !dbc){ toast('Somente o dono pode salvar'); return; }
  const docUrl=document.getElementById('s_url').value.trim();
  if(!docUrl){ toast('Cole o link do documento da súmula'); return; }
  const data={ date:document.getElementById('s_date').value, competition:document.getElementById('s_comp').value.trim(),
    round:document.getElementById('s_round').value.trim(), referee:document.getElementById('s_ref').value||null,
    home:document.getElementById('s_home').value.trim(), away:document.getElementById('s_away').value.trim(),
    docUrl, notes:document.getElementById('s_notes').value.trim() };
  try{
    const oldSum = id? sumView(DB.sumulas.find(x=>x.id===id)||{}) : null;
    if(id){ await dbc.collection('sumulas').doc(id).update(data); }
    else { await dbc.collection('sumulas').add(data); }
    const sTitle=((data.home||'?')+' x '+(data.away||'?'))+(data.competition?' · '+data.competition:'');
    if(id){ const ch=diffMap(oldSum,sumView(data),SUM_LABELS); if(ch.length) logChange('edit','Súmula',sTitle,ch); }
    else logChange('create','Súmula',sTitle,['Link: '+data.docUrl]);
    closeModal(); toast('Súmula salva');
  }catch(e){ toast('Não foi possível salvar — tente novamente'); }
}
async function deleteSumula(id){
  if(!isOwner || !dbc){ toast('Somente o dono pode excluir'); return; }
  const oldS=DB.sumulas.find(x=>x.id===id)||{};
  try{ await dbc.collection('sumulas').doc(id).delete(); logChange('delete','Súmula',(oldS.home||'?')+' x '+(oldS.away||'?'),[]); closeModal(); toast('Súmula removida'); }
  catch(e){ toast('Não foi possível excluir — tente novamente'); }
}

/* ---------- Configurações ---------- */
function renderConfig(){
  const el=document.getElementById('view-config');
  const dis = isOwner? '' : 'disabled';
  el.innerHTML = `<div class="card" style="max-width:520px">
    <div class="cfgrow"><div><div class="cl">Valor por MAIN</div><div class="cs">Pago ao árbitro principal por partida</div></div><input id="c_main" type="number" value="${DB.config.main}" ${dis}></div>
    <div class="cfgrow"><div><div class="cl">Valor por ASSIST</div><div class="cs">Pago aos árbitros assistentes por partida</div></div><input id="c_assist" type="number" value="${DB.config.assist}" ${dis}></div>
    <div class="cfgrow"><div><div class="cl">Valor por W.O.</div><div class="cs">Pago quando a partida termina em W.O.</div></div><input id="c_wo" type="number" value="${DB.config.wo}" ${dis}></div>
    <div class="cfgrow"><div><div class="cl">Valor por Autodraw</div><div class="cs">Pago quando a partida termina em Autodraw. Conta como 20 minutos, igual ao W.O.</div></div><input id="c_ad" type="number" value="${DB.config.ad==null?5:DB.config.ad}" ${dis}></div>
    <div class="cfgrow"><div><div class="cl">Mínimo de partidas para MAIN em jogo grande</div><div class="cs">UEFA, CONMEBOL e clássicos. Quem tem menos não entra na sugestão como MAIN.</div></div><input id="c_bigmain" type="number" min="0" value="${bigMin().main}" ${dis}></div>
    <div class="cfgrow"><div><div class="cl">Mínimo de partidas para ASSIST em jogo grande</div><div class="cs">Mesma regra, para os assistentes.</div></div><input id="c_bigassist" type="number" min="0" value="${bigMin().assist}" ${dis}></div>
  </div>
  ${isOwner? `<div class="card" style="max-width:520px;margin-top:16px"><div class="cl">Backup dos dados</div><div class="cs" style="margin-bottom:12px">Baixe uma cópia completa (árbitros, escalas, escudos, histórico) ou restaure a partir de um arquivo de backup. Restaurar não apaga nada: só cria ou atualiza.</div>
    <button class="btn" onclick="definirSenha()">Definir senha de acesso</button> <button class="btn" onclick="exportBackup()">Baixar backup</button> <button class="btn" onclick="document.getElementById('bkfile').click()">Importar backup</button>
    <input type="file" id="bkfile" accept=".json,application/json" style="display:none" onchange="importBackup(this.files[0]);this.value=''"></div>`:''}
  ${isOwner? '<button class="btn" style="margin-top:16px" onclick="saveConfig()">Salvar e Recalcular Folha</button>' : '<div class="emptystate" style="padding:16px 0"><span class="pill inactive">Somente leitura</span></div>'}`;
}
async function exportBackup(){
  try{
    const out=[]; const sb=window._sb;
    for(let from=0;;from+=500){ const {data,error}=await sb.from('docs').select('coll,id,data').like('coll',window.DBNS+'%').order('coll').order('id').range(from,from+499); if(error) throw error; out.push(...data); if(data.length<500) break; }
    const blob=new Blob([JSON.stringify({app:'saml-manager',version:1,exportedAt:new Date().toISOString(),docs:out})],{type:'application/json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='saml-backup-'+new Date().toISOString().slice(0,10)+'.json'; a.click();
    toast('Backup baixado ('+out.length+' documentos)');
  }catch(e){ toast('Falha ao gerar backup: '+(e.message||e)); }
}
async function importBackup(f){
  if(!f) return;
  try{
    const j=JSON.parse(await f.text()); const docs=j.docs||[];
    if(!docs.length||!docs.every(d=>d.coll&&d.id&&d.data)) throw new Error('arquivo inválido');
    const NS=window.DBNS||''; docs.forEach(d=>{ if(!d.coll.startsWith(NS)) d.coll=NS+d.coll; });
    if(!confirm('Importar '+docs.length+' documentos? Itens com o mesmo ID serão atualizados; nada é apagado.')) return;
    for(let i=0;i<docs.length;i+=20){ const {error}=await window._sb.from('docs').upsert(docs.slice(i,i+20).map(d=>({coll:d.coll,id:d.id,data:d.data}))); if(error) throw error; }
    toast('Backup importado: '+docs.length+' documentos');
  }catch(e){ alert('Falha ao importar: '+(e.message||e)); }
}
async function saveConfig(){
  if(!isOwner || !dbc){ toast('Somente o dono pode alterar os valores'); return; }
  const cfg={ main:Number(document.getElementById('c_main').value)||0, assist:Number(document.getElementById('c_assist').value)||0, wo:Number(document.getElementById('c_wo').value)||0, ad:Number(document.getElementById('c_ad').value)||0,
    bigMinMain:Math.max(0,Number(document.getElementById('c_bigmain').value)||0), bigMinAssist:Math.max(0,Number(document.getElementById('c_bigassist').value)||0) };
  const oldCfg={...DB.config};
  try{ await dbc.doc('config/main').set(cfg); const ch=diffCfg(oldCfg,cfg); if(ch.length) logChange('edit','Configurações','Valores de pagamento',ch); toast('Valores atualizados — folha recalculada para todos'); }
  catch(e){ toast('Não foi possível salvar as configurações'); }
}

/* ---------- Busca global ---------- */
document.getElementById('globalsearch').addEventListener('input', function(){
  const q=this.value.trim().toLowerCase(); const box=document.getElementById('searchresults');
  if(!q){ box.style.display='none'; return; }
  const refs=DB.referees.filter(r=>r.name.toLowerCase().includes(q) || (r.tier||'').toLowerCase().includes(q)).slice(0,8)
    .map(r=>({label:r.name, sub:r.tier||'Sem tier', fn:`openProfile('${r.id}')`}));
  box.innerHTML = refs.length? refs.map(r=>`<div onclick="${r.fn}; document.getElementById('globalsearch').value=''; document.getElementById('searchresults').style.display='none'"><span class="tag">Árbitro</span><br>${r.label} — ${r.sub}</div>`).join('') : `<div style="cursor:default;color:var(--muted)">Nenhum resultado</div>`;
  box.style.display='block';
});
document.addEventListener('click', e=>{ if(!e.target.closest('.searchbox')) document.getElementById('searchresults').style.display='none'; });

/* ---------- Modal helpers ---------- */
function openModal(){ document.getElementById('overlay').classList.add('active'); }
function closeModal(){ document.getElementById('overlay').classList.remove('active'); }
document.getElementById('overlay').addEventListener('click', e=>{ if(e.target.id==='overlay') closeModal(); });

/* ---------- Render router ---------- */
function render(){
  if(CURRENT==='dashboard') renderDashboard();
  else if(CURRENT==='arbitros') renderArbitros();
  else if(CURRENT==='folha') renderFolha();
  else if(CURRENT==='rankings') renderRankings();
  else if(CURRENT==='desempenho') renderDesempenho();
  else if(CURRENT==='escala') renderEscala();
  else if(CURRENT==='sumulas') renderSumulas();
  else if(CURRENT==='historico') renderHistorico();
  else if(CURRENT==='config') renderConfig();
}

/* ---------- Mesmo padrão em todas as páginas: título de seção + foco preservado ---------- */
const VIEW_TITLES={
  renderArbitros:['view-arbitros','Quadro de','árbitros'], renderFolha:['view-folha','Valores da','temporada'],
  renderRankings:['view-rankings','Os melhores da','temporada'], renderDesempenho:['view-desempenho','Nota e','confiança'],
  renderEscala:['view-escala','Partidas','escaladas'], renderSumulas:['view-sumulas','Biblioteca de','súmulas'],
  renderHistorico:['view-historico','Registro de','alterações'], renderConfig:['view-config','Valores por','marcação']
};
Object.entries(VIEW_TITLES).forEach(([fn,[vid,a,b]])=>{
  const orig=window[fn];
  window[fn]=function(){
    const ae=document.activeElement, aid=ae&&ae.id, pos=ae&&ae.selectionStart;
    orig();
    document.getElementById(vid).insertAdjacentHTML('afterbegin','<div class="d-title" style="margin-top:36px"><div class="bar"></div><h3>'+a+' <span>'+b+'</span></h3></div>');
    if(aid){ const n=document.getElementById(aid); if(n&&n.tagName==='INPUT'){ n.focus(); try{ n.setSelectionRange(pos,pos); }catch(e){} } }
  };
});

buildNav();
initChrome();
window.initUser=initUser;
const _h=((typeof location!=='undefined'&&location.hash)||'').slice(1);
goto(/^[a-z]+$/.test(_h)?_h:'dashboard');
initDB();
initUser();
</script>
